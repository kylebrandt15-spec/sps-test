// ─── Number ticker hook ───────────────────────────────────────────────────────
function useCountUp(target, shouldAnimate) {
  const [val, setVal] = useState(0);
  const rafRef = useRef(null);
  const startRef = useRef(null);
  const animated = useRef(false);

  useEffect(() => {
    if (!shouldAnimate) { setVal(target); return; }
    if (animated.current) { setVal(target); return; }
    animated.current = true;
    cancelAnimationFrame(rafRef.current);
    startRef.current = null;
    function step(ts) {
      if (!startRef.current) startRef.current = ts;
      const t = Math.min((ts - startRef.current) / 800, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      setVal(Math.round(target * ease));
      if (t < 1) rafRef.current = requestAnimationFrame(step);
    }
    rafRef.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(rafRef.current);
  }, [shouldAnimate]);

  useEffect(() => {
    if (animated.current) setVal(target);
  }, [target]);

  return val;
}

function ProgressBar({ found, total }) {
  const pct = (found / total) * 100;
  const complete = found === total;
  return h('div', { style:{ marginBottom:'1rem' } },
    h('div', { style:{ display:'flex', justifyContent:'space-between', marginBottom:'6px' } },
      h('span', {
        style:{ fontSize:'13px', fontWeight:600, color: complete ? '#1D9E75':'#0C447C', transition:'color .3s' }
      }, complete ? 'All 12 problems found — see your total cost below ↓' : `Problems found: ${found} / ${total}`),
      !complete && h('span', { style:{ fontSize:'12px', color:'#888' } }, `${total - found} remaining`)
    ),
    h('div', {
      role:'progressbar', 'aria-valuenow':found, 'aria-valuemin':0, 'aria-valuemax':total,
      'aria-label':`${found} of ${total} problems found`,
      style:{ background:'#e5e5e5', borderRadius:'99px', height:'8px', overflow:'hidden' }
    },
      h('div', {
        style:{

          background: complete ? '#1D9E75':'#0C447C',
          width:`${pct}%`, transition:'width .3s ease, background .3s ease'
        }
      })
    )
  );
}

function Tooltip({ problem, supplierCount, onDismiss }) {
  const cost = computeCost(problem.baseCost, supplierCount);
  useEffect(() => {
    const t = setTimeout(onDismiss, 1800);
    return () => clearTimeout(t);
  }, [onDismiss]);

  return h('div', {
    role:'tooltip',
    style:{
      position:'absolute', bottom:'calc(100% + 10px)', left:'50%',
      transform:'translateX(-50%)',
      background:'#1a1a1a', color:'#fff', borderRadius:'8px',
      padding:'10px 14px', fontSize:'12px', lineHeight:1.5,
      boxShadow:'0 4px 16px rgba(0,0,0,.22)', zIndex:100,
      width:'210px', pointerEvents:'none',
      animation:'tipIn .15s ease both'

    h('p',{style:{fontWeight:700,marginBottom:'4px',margin:'0 0 4px',color:'#1D9E75'}}, problem.label),
    h('p',{style:{color:'#a0e4c5',fontWeight:600,margin:'0 0 6px'}}, `$${cost.toLocaleString()} / yr`),
    h('p',{style:{color:'rgba(255,255,255,.80)',margin:0}}, problem.tooltip)
  );
}

function ProblemCard({ problem, found, onReveal, locked, supplierCount }) {
  const [tip, setTip] = useState(false);
  const [popping, setPopping] = useState(false);

  function activate() {
    if (locked || found) return;
    onReveal(problem.id);
    setPopping(true);
    setTip(true);
  }

  function onKeyDown(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
  }

  function onAnimEnd() { setPopping(false); }

  const cc = CAT_COLORS[problem.category] || { bg:'#f0f0f0', text:'#666' };

  return h('div', { style:{ position:'relative' } },
    tip && h(Tooltip, { problem, supplierCount, onDismiss:()=>setTip(false) }),
    h('div', {
      tabIndex: locked ? -1 : 0,
      role:'button',
      'aria-pressed': found,
      'aria-label': `${problem.label}: ${problem.description}`,
      className: `card-btn${popping ? ' pop' : ''}`,
      onClick: activate,
      onKeyDown,
      onAnimationEnd: onAnimEnd,
      style:{
        background: found ? '#e8f5e9' : '#f9f9f9',
        border: `1px solid ${found ? '#1D9E75':'#ddd'}`,
        borderRadius:'8px', padding:'0.875rem',
        cursor: locked || found ? 'default':'pointer',
        position:'relative', outline:'none',
        transition:'background .2s, border-color .2s, box-shadow .15s',
        minHeight:'82px', display:'flex', flexDirection:'column', gap:'4px',
        userSelect:'none',
      },
      onMouseEnter(e) {
        if (!found && !locked) {
          e.currentTarget.style.background='#f0f5ff';
          e.currentTarget.style.borderColor='#0C447C';
          e.currentTarget.style.boxShadow='0 2px 8px rgba(12,68,124,.15)';
        }
      },
      onMouseLeave(e) {
        if (!found && !locked) {
          e.currentTarget.style.background='#f9f9f9';
          e.currentTarget.style.borderColor='#ddd';
          e.currentTarget.style.boxShadow='none';
        }
      }
    },
      found && h('span',{
        'aria-hidden':true,
        style:{ position:'absolute', top:'8px', right:'8px', color:'#1D9E75', fontWeight:700, fontSize:'14px' }
      }, '✓'),
      h('p',{
        style:{ fontSize:'13px', fontWeight:600, color: found?'#1D9E75':'#1a1a1a', lineHeight:1.3, margin:0, transition:'color .2s', paddingRight:'16px' }
      }, problem.label),
      h('p',{style:{fontSize:'11px',color:'#888',lineHeight:1.4,margin:0}}, problem.description),
      h('span',{
        style:{
          display:'inline-block', marginTop:'6px',
          background:cc.bg, color:cc.text,
          fontSize:'10px', fontWeight:600, borderRadius:'99px',
          padding:'2px 8px', textTransform:'uppercase', letterSpacing:'.5px', alignSelf:'flex-start'
        }
      }, problem.category)
    )
  );
}

function EmailGate({ supplierCount, onSubmit }) {
  const [email, setEmail] = useState('');
  const [company, setCompany] = useState('');
  const [sc, setSc] = useState(String(supplierCount));
  const [errors, setErrors] = useState({});
  const [loading, setLoading] = useState(false);

  function validate() {
    const e = {};
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email = 'Please enter a valid work email';
    if (company.trim().length < 2) e.company = 'Please enter your company name';
    return e;
  }

  async function handleSubmit(ev) {
    ev.preventDefault();
    const e = validate();
    setErrors(e);
    if (Object.keys(e).length) return;
    setLoading(true);
    const scNum = Math.max(1, parseInt(sc) || supplierCount);
    const totalHiddenCost = computeTotal(scNum);
    const payload = {
      email, company, supplierCount: scNum, totalHiddenCost,
      timestamp: new Date().toISOString(),
      source:'find-hidden-cost-game',
      campaign:'Campaign03-BestDataBestAI'
    };
    analytics.track('email_submitted', { supplierCount: scNum, totalCost: totalHiddenCost });
    try {
      const res = await fetch('/api/leads', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
      });
      if (res.ok) analytics.track('email_confirmed');
      else console.log('[lead payload — API error, advancing]', payload);
    } catch { console.log('[lead payload — network error, advancing]', payload); }
    setLoading(false);
    onSubmit();
  }

  const inp = (hasErr) => ({
    width:'100%', border:`1px solid ${hasErr?'#A32D2D':'#ddd'}`,
    borderRadius:'6px', padding:'10px 12px', fontSize:'14px',
    outline:'none', color:'#1a1a1a', background:'#fff', fontFamily:'inherit'
  });

  return h('div',{
    className:'fade-up',
    style:{
      background:'#fff', borderRadius:'12px', padding:'2rem',
      boxShadow:'0 1px 3px rgba(0,0,0,.10)', marginTop:'1.25rem',
      maxWidth:'520px', marginLeft:'auto', marginRight:'auto'
    }
  },
    h('h2',{style:{fontSize:'22px',fontWeight:700,color:'#1a1a1a',marginBottom:'.5rem',marginTop:0}},
      'See how you compare to peers'),
    h('p',{style:{fontSize:'14px',color:'#555',marginBottom:'1.25rem',lineHeight:1.6}},
      "Get your personalized infrastructure cost analysis and benchmark report. We'll send it to your inbox within 24 hours."),
    h('ul',{style:{listStyle:'none',padding:0,margin:'0 0 1.5rem',display:'flex',flexDirection:'column',gap:'8px'}},
      ['Your full cost breakdown as a shareable PDF',
       'Where you rank vs. industry averages (31.7% ASN compliance baseline)',
       'The 3-step infrastructure roadmap to close the gap',
       'Forrester TEI ROI model — 360% ROI over 3 years'
      ].map(item => h('li',{key:item,style:{display:'flex',alignItems:'flex-start',gap:'8px',fontSize:'13px',color:'#333'}},
        h('span',{style:{color:'#1D9E75',fontWeight:700,flexShrink:0,marginTop:'1px'}},'✓'),
        item
      ))
    ),
    h('form',{onSubmit:handleSubmit,noValidate:true,style:{display:'flex',flexDirection:'column',gap:'12px'}},
      h('div',{style:{display:'flex',flexDirection:'column',gap:'4px'}},
        h('label',{htmlFor:'f-email',style:{fontSize:'12px',fontWeight:600,color:'#555'}},'Work email'),
        h('input',{id:'f-email',type:'email',placeholder:'your.email@company.com',autoComplete:'email',
          value:email,onChange:e=>setEmail(e.target.value),style:inp(errors.email)}),
        errors.email && h('p',{style:{fontSize:'11px',color:'#A32D2D',margin:0}},errors.email)
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'4px'}},
        h('label',{htmlFor:'f-company',style:{fontSize:'12px',fontWeight:600,color:'#555'}},'Company name'),
        h('input',{id:'f-company',type:'text',placeholder:'Company name',autoComplete:'organization',
          value:company,onChange:e=>setCompany(e.target.value),style:inp(errors.company)}),
        errors.company && h('p',{style:{fontSize:'11px',color:'#A32D2D',margin:0}},errors.company)
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'4px'}},
        h('label',{htmlFor:'f-sc',style:{fontSize:'12px',fontWeight:600,color:'#555'}},
          "Active suppliers (we'll use this to personalize your report)"),
        h('input',{id:'f-sc',type:'number',min:1,max:5000,
          value:sc,onChange:e=>setSc(e.target.value),style:inp(false)})
      ),
      h('button',{type:'submit',disabled:loading,
        style:{
          marginTop:'4px', width:'100%',
          background:loading?'#6b9fd4':'#0C447C',
          color:'#fff', border:'none', borderRadius:'6px',
          padding:'12px', fontSize:'15px', fontWeight:700,
          cursor:loading?'not-allowed':'pointer',
          display:'flex', alignItems:'center', justifyContent:'center', gap:'8px',
          transition:'background .15s', fontFamily:'inherit'
        },
        onMouseEnter(e){ if(!loading) e.currentTarget.style.background='#185FA5'; },
        onMouseLeave(e){ if(!loading) e.currentTarget.style.background='#0C447C'; }
      },
        loading
          ? [h('svg',{key:'s',width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.5,strokeLinecap:'round',style:{animation:'spin .75s linear infinite'},'aria-hidden':true},
              h('path',{d:'M12 2a10 10 0 0 1 10 10',opacity:.3}),
              h('path',{d:'M12 2a10 10 0 0 1 10 10'})
            ), 'Sending…']
          : 'Send my report →'
      )
    )
  );
}

    },'✓'),

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [phase, setPhase] = useState('PLAYING');
  const [foundIds, setFoundIds] = useState(new Set());
  const [supplierCount, setSupplierCount] = useState(100);
  const [started, setStarted] = useState(false);
  const resultsRef = useRef(null);
  const completedFired = useRef(false);

  const revealProblem = useCallback((id) => {
    if (phase !== 'PLAYING') return;
    setFoundIds(prev => {
      if (prev.has(id)) return prev;
      if (!started) { analytics.track('game_started'); setStarted(true); }
      const p = PROBLEMS.find(p => p.id === id);
      analytics.track('problem_found', { problemId:id, problemLabel:p?.label });
      const next = new Set(prev);
      next.add(id);
      if (next.size === PROBLEMS.length) {
        setTimeout(() => setPhase('COMPLETE'), 400);
      }
      return next;
    });
  }, [phase, started]);

  useEffect(() => {
    if (phase === 'COMPLETE') {
      const t = setTimeout(() => {
        resultsRef.current?.scrollIntoView({ behavior:'smooth', block:'start' });
      }, 300);
      return () => clearTimeout(t);
    }
  }, [phase]);

  useEffect(() => {
    if (phase === 'COMPLETE' && !completedFired.current) {
      completedFired.current = true;
      analytics.track('game_completed', { supplierCount, totalCost: computeTotal(supplierCount) });
    }
  }, [phase, supplierCount]);

  return h('div',{ style:{ minHeight:'100vh', background:'#f5f5f5' } },
    h(Hero),
    h('main',{
      style:{ maxWidth:'900px', margin:'0 auto', padding:'1.5rem 1rem' }
    },
      h(GameBoard, { foundIds, onReveal:revealProblem, phase, supplierCount }),
      h(SupplierSlider, { value:supplierCount, onChange:setSupplierCount }),

      (phase === 'COMPLETE' || phase === 'SUBMITTED') && h('div',{ ref:resultsRef },
        h(CostBreakdown, { supplierCount }),
        phase === 'COMPLETE' && h(EmailGate, { supplierCount, onSubmit:()=>setPhase('SUBMITTED') }),
        phase === 'SUBMITTED' && h(ConfirmationView)
      ),

      h('footer',{
        style:{
          marginTop:'2.5rem', paddingTop:'1.25rem',
          borderTop:'1px solid #e5e5e5', textAlign:'center'
        }
      },
        h('p',{style:{fontSize:'11px',color:'#bbb',margin:0}},
          `© ${new Date().getFullYear()} SPS Commerce. Cost estimates are illustrative based on industry research and SPS network data.`
        )
      )
    )
  );
}

createRoot(document.getElementById('root')).render(h(App));
</script>
